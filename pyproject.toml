[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lh-db-auditor"
version = "0.1.0"
description = "Audits PostgreSQL (postgresql.conf, pg_hba.conf), MySQL (my.cnf), Redis (redis.conf), and MongoDB (mongod.cfg) configurations for trust authentication, disabled TLS, wildcard bind addresses, and missing audit logs."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "logihertzsystems", email = "ops@logihertz.com" },
    { name = "Sameer Tawade (Creator, Founder, Director & Sole Developer)", email = "ops@logihertz.com" },
]
maintainers = [
    { name = "Logihertz Systems (OPC) Private Limited", email = "ops@logihertz.com" },
]
keywords = [
    "database-security",
    "postgresql",
    "mysql",
    "redis-security",
    "mongodb",
    "hardening",
    "logihertz",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "bandit>=1.7.8",
]


[project.urls]
Homepage = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-db-auditor"
Repository = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-db-auditor"
Documentation = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-db-auditor#documentation"
Issues = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-db-auditor/issues"

[project.scripts]
lh-db = "lh_db_auditor.cli:app"
lh-db-auditor = "lh_db_auditor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lh_db_auditor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

